name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check script and workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          for path in Path("scripts").glob("*.py"):
              ast.parse(path.read_text(), filename=str(path))
          for name in ("CMakePresets.json", "vcpkg.json"):
              json.loads(Path(name).read_text())
          PY
          ruby <<'RUBY'
          require "yaml"

          walk = lambda do |node, path|
            case node
            when Hash
              node.each do |key, value|
                if key.to_s == "uses"
                  ref = value.to_s
                  local = ref.match?(/\A\.\/[^\0]+\z/)
                  pinned = ref.match?(/\A[^@\s]+@[0-9a-f]{40}\z/)
                  unless local || pinned
                    abort "#{path} uses a mutable or invalid action ref: #{ref}"
                  end
                end
                walk.call(value, path)
              end
            when Array
              node.each { |value| walk.call(value, path) }
            end
          end

          Dir.glob(".github/workflows/*.{yml,yaml}").sort.each do |path|
            walk.call(YAML.safe_load(File.read(path), aliases: false), path)
          end
          RUBY
          bash -n scripts/*.sh \
            packaging/linux/postinst packaging/linux/postrm \
            packaging/linux/rpm-post.sh packaging/linux/rpm-postun.sh

      - name: Test reviewed CI authorization
        run: python3 -B scripts/test_reviewed_ci.py
