# Temporary installer debugging workflow. Remove before merging into main.
name: Installer verification

on:
  push:
    branches: [t3code/compare-msi-and-exe]
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run containing the unchanged Windows application payload
        required: true
        default: '37585194165'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download previously built Windows payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-verification
          path: build/x64-release
          run-id: ${{ inputs.run_id || '37585194165' }}
          github-token: ${{ github.token }}

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw "Accepting the WiX EULA failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX UI extension failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Util.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX utility extension failed" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Rebuild MSI with current installer source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = $env:GITHUB_WORKSPACE
          $build = Join-Path $repository 'build\x64-release'
          $deploy = Join-Path $build 'deploy'
          $generated = Join-Path $build 'generated'
          $version = (Get-Item (Join-Path $deploy 'MervinPDF.exe')).VersionInfo.FileVersion
          New-Item -ItemType Directory -Path $generated -Force | Out-Null

          # Reuse the version rules without rebuilding the application.
          $cmakeRepository = $repository.Replace('\', '/')
          $cmakeGenerated = $generated.Replace('\', '/')
          @(
              "include([[$cmakeRepository/cmake/Version.cmake]])",
              "configure_file([[$cmakeRepository/cmake/package-version.json.in]] [[$cmakeGenerated/package-version.json]] @ONLY)"
          ) | Set-Content (Join-Path $generated 'metadata.cmake') -Encoding utf8
          cmake "-DMERVIN_VERSION=$version" -P (Join-Path $generated 'metadata.cmake')
          if ($LASTEXITCODE -ne 0) { throw "Generating installer version metadata failed" }
          $metadata = Get-Content (Join-Path $generated 'package-version.json') -Raw | ConvertFrom-Json

          $cleanupFile = Join-Path $generated 'installer-remove-folders.wxi'
          $cleanup = @('<Include xmlns="http://wixtoolset.org/schemas/v4/wxs">',
                       '  <RemoveFolder Id="RemoveInstallFolder" Directory="INSTALLFOLDER" On="uninstall" />')
          $index = 0
          foreach ($dir in Get-ChildItem $deploy -Directory -Recurse | Sort-Object FullName) {
              $relative = $dir.FullName.Substring($deploy.Length + 1)
              $escaped = [System.Security.SecurityElement]::Escape($relative)
              $cleanup += "  <RemoveFolder Id=`"RemovePayloadFolder$index`" Directory=`"INSTALLFOLDER`" Subdirectory=`"$escaped`" On=`"uninstall`" />"
              $index++
          }
          $cleanup += '</Include>'
          Set-Content -Path $cleanupFile -Value $cleanup -Encoding utf8

          $msi = Join-Path $build "MervinPDF-$version.msi"
          wix build -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
              -d "Version=$($metadata.msi_version)" -d "DisplayVersion=$version" `
              -d "DeployDir=$deploy" -d "IconFile=$repository\resources\icons\mervin-icon.ico" `
              -d "DirectoryCleanup=$cleanupFile" -d "TessData=$repository\resources\tessdata\eng.traineddata" `
              -o $msi "$repository\packaging\wix\mervin.wxs"
          if ($LASTEXITCODE -ne 0) { throw "Rebuilding MSI failed" }
          "MERVIN_VERIFICATION_MSI=$msi" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify MSI install, upgrade, repair, and uninstall
        shell: pwsh
        run: scripts\test-windows-installer.ps1 -Msi $env:MERVIN_VERIFICATION_MSI

      - name: Verify MSI wizard and launch after Finish
        shell: pwsh
        run: |
          scripts\test-windows-installer-ui.ps1 -Msi $env:MERVIN_VERIFICATION_MSI `
            -OutputDir "$env:MERVIN_INSTALLER_TEST_DIR\ui"

      - name: Upload installer diagnostics
        if: always() && env.MERVIN_INSTALLER_TEST_DIR != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer-diagnostics
          path: ${{ env.MERVIN_INSTALLER_TEST_DIR }}/
          if-no-files-found: error
          retention-days: 7

      - name: Upload rebuilt MSI
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer-msi
          path: build/x64-release/MervinPDF-*.msi
          if-no-files-found: warn
          retention-days: 7
