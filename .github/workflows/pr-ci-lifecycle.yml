name: PR CI lifecycle

on:
  pull_request_target:
    types: [synchronize, closed, converted_to_draft, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # Only default-branch controls run with this cancellation token. The job
      # never loads PR code or artifacts and cannot publish commit statuses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Cancel obsolete, closed, or draft PR builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/cancel_pr_ci.py
