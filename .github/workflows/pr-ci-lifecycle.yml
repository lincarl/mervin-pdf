name: PR CI lifecycle

on:
  pull_request_target:
    types: [synchronize, closed, converted_to_draft, reopened, ready_for_review]
  workflow_run:
    workflows: ['Start CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: write
  statuses: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job never checks out or executes PR code or build artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Cancel builds for obsolete PR revisions
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -B scripts/reviewed_ci.py invalidate
      - name: Fail an unfinished result after workflow termination
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -B scripts/reviewed_ci.py reconcile
