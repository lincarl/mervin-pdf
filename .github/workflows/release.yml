name: release

# Stable tags publish regular releases. CI calls this workflow after a successful
# main push to allocate an RC tag and publish the same packages as a prerelease.
on:
  push:
    tags: ['v*']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  MUPDF_VERSION: "1.28.5"
  MUPDF_SHA256: "98a5c10cda20c3992cdf76ff6b2a1149c32bd79cc796d3f703230b1185b7e934"

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          [[ "$status" == identical || "$status" == ahead ]] || {
            echo "Release commit is not on main" >&2
            exit 1
          }

      - name: Prepare release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            python3 scripts/prepare-prerelease.py
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(python3 scripts/version-from-tag.py "$GITHUB_REF_NAME")
            {
              echo "tag=$GITHUB_REF_NAME"
              echo "version=$version"
              if [[ "$version" == *-rc* ]]; then
                echo "prerelease=true"
              else
                echo "prerelease=false"
              fi
            } >> "$GITHUB_OUTPUT"
          else
            echo "Releases require a version tag push or successful CI for a main push" >&2
            exit 1
          fi

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          read -r type target < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv')
          if [[ "$type" == tag ]]; then
            read -r type target < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '[.object.type, .object.sha] | @tsv')
          fi
          [[ "$type" == commit && "$target" == "$GITHUB_SHA" ]] || {
            echo "Tag does not resolve to workflow commit $GITHUB_SHA" >&2
            exit 1
          }

  # ---------------------------------------------------------------- Windows ---
  windows:
    needs: prepare
    runs-on: windows-2022
    env:
      MERVIN_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up MSVC (x64)
        # Maintained, Node-24 vcvars action (fork of the now-unmaintained
        # ilammy/msvc-dev-cmd). Exports the MSVC dev env to later steps via
        # $GITHUB_ENV/$GITHUB_PATH, so Configure/Build inherit cl/INCLUDE/LIB.
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          # aqtinstall 3.3.0 cannot read Qt 6.11+ Windows repository paths.
          # Pin the merged fix until it ships in a release: miurahr/aqtinstall#1000.
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache MuPDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Must match build-mupdf-windows.ps1's default -Dest (invoked below with
          # no arguments): C:\dev is the project's tool root on Windows.
          path: C:\dev\src\mupdf-${{ env.MUPDF_VERSION }}-source
          key: mupdf-${{ env.MUPDF_VERSION }}-${{ env.MUPDF_SHA256 }}-windows-msvc2022-v143

      - name: Build MuPDF
        shell: pwsh
        run: |
          $dir = & scripts\build-mupdf-windows.ps1 | Select-Object -Last 1
          "MUPDF_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-

      - name: Configure
        shell: pwsh
        run: |
          # Read these in-shell ($env:) rather than via GitHub Actions expression
          # interpolation: QT_ROOT_DIR (exported by install-qt-action) and the
          # VCPKG_INSTALLATION_ROOT. The windows-base preset reads $env:QT6_DIR ->
          # CMAKE_PREFIX_PATH and $env:VCPKG_ROOT -> the vcpkg toolchainFile.
          $env:QT6_DIR = $env:QT_ROOT_DIR
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          $env:VCPKG_ROOT = $vcpkg
          # Version lookup uses the checked-out registry, so fetching the baseline
          # alone leaves the runner's older versions database active. Align the
          # registry, ports, toolchain and executable with our pinned revision.
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw "vcpkg.json must pin a builtin-baseline" }
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "Fetching vcpkg baseline failed" }
          git -C $env:VCPKG_ROOT checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { throw "Checking out vcpkg baseline failed" }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Bootstrapping vcpkg failed" }
          # MERVIN_BUILD_TESTS=OFF, same as every Linux job. The release pipeline
          # never runs ctest - the tests (and the tst_perf_* guardrails) are a local
          # check made BEFORE a change ships, not a release artifact. Building them
          # here cost 109 of the build step's 125 minutes: MervinPDF.exe links 15
          # minutes in, then 33 tst_/dump_ executables each statically re-link
          # MuPDF+Tesseract with PDBs, only to be thrown away unrun.
          cmake --preset x64-release "-DMERVIN_VERSION=$env:MERVIN_VERSION" -DMERVIN_WIN32_SUBSYSTEM=ON -DMERVIN_BUILD_TESTS=OFF "-DMUPDF_DIR=$env:MUPDF_DIR"

      - name: Build
        run: cmake --build --preset x64-release

      - name: Install packaging tools (NSIS + WiX)
        shell: pwsh
        run: |
          choco install nsis -y
          dotnet tool install --global wix
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Stage + build installers
        shell: pwsh
        run: |
          $env:QT6_DIR = $env:QT_ROOT_DIR
          scripts\deploy.ps1 -Installer

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installers
          path: |
            build/x64-release/MervinPDF-Setup-*.exe
            build/x64-release/MervinPDF-*.msi
          if-no-files-found: error

  # --------------------------------------------------------------- AppImage ---
  # Built on Ubuntu 26.04 - the only supported release - against that release's
  # system Qt 6.10, exactly like the .deb. Building on the older 24.04 and leaning
  # on glibc forward-compatibility did NOT hold up in practice, so the bundle is
  # now made on the release it targets. linuxdeploy still copies Qt into the
  # AppDir, so the AppImage stays self-contained; it is just no longer portable
  # to releases older than the one it was built on.
  appimage:
    needs: prepare
    runs-on: ubuntu-26.04
    env:
      MERVIN_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build deps
        # qt6-base-dev pulls in libqt6gui6, which is what actually ships the xcb
        # platform plugin (qt6/plugins/platforms/libqxcb.so) that linuxdeploy has to
        # bundle - so --no-install-recommends is safe here. qt6-base-dev-tools
        # provides qmake6, which linuxdeploy-plugin-qt uses to locate that plugin dir.
        # qt6-svg-dev: the icons are Lucide SVGs rendered through Qt SVG. Linking Qt
        # SVG makes linuxdeploy-plugin-qt bundle the SVG icon engine plugin too, which
        # ships separately in qt6-svg-plugins (not pulled in without recommends).
        # qt6-tools-dev: Qt's LinguistTools CMake package; it pulls lupdate,
        # lrelease and lprodump. qt6-translations-l10n: Qt's own catalogs
        # (qtbase_<id>.qm), which the build merges into Mervin's; configure stops
        # without them. make-appimage.sh keeps the loose copies out of the bundle.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build curl ca-certificates file wget \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-svg-plugins \
            qt6-tools-dev qt6-translations-l10n \
            libqpdf-dev libtomlplusplus-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0

      - name: Cache MuPDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/src/mupdf-${{ env.MUPDF_VERSION }}-source
          key: mupdf-${{ env.MUPDF_VERSION }}-${{ env.MUPDF_SHA256 }}-ubuntu2604

      - name: Build MuPDF
        run: echo "MUPDF_DIR=$(bash scripts/build-mupdf-linux.sh)" >> "$GITHUB_ENV"

      - name: Configure + build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMERVIN_VERSION="$MERVIN_VERSION" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMERVIN_BUILD_TESTS=OFF \
            -DMUPDF_DIR="$MUPDF_DIR"
          cmake --build build

      - name: Install into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Build AppImage
        run: bash scripts/make-appimage.sh "$MERVIN_VERSION" AppDir

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-appimage
          path: MervinPDF-*-x86_64.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------------- .deb ---
  # Native .deb built against the distro's system Qt. Only Ubuntu 26.04 (Qt 6.10):
  # 24.04 ships Qt 6.4, below the Qt 6.9 the build needs (merging Qt's own
  # translations) and without the 6.6/6.8 APIs Mervin uses (accent colour,
  # color-scheme control), and the AppImage no longer covers 24.04 either - 26.04
  # is the minimum supported release. (Matrix kept for easy re-add of later ones.)
  deb:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      MERVIN_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:26.04", release: "26.04" }
    container: ${{ matrix.image }}
    steps:
      - name: Install build deps
        # qt6-tools-dev and qt6-translations-l10n: the UI translations, as in the
        # appimage job. The catalogs are compiled into the binary, so the .deb
        # needs neither at run time.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build curl ca-certificates file git dpkg-dev python3 \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-tools-dev qt6-translations-l10n \
            libqpdf-dev libtomlplusplus-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build MuPDF
        run: echo "MUPDF_DIR=$(bash scripts/build-mupdf-linux.sh)" >> "$GITHUB_ENV"

      - name: Configure + build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMERVIN_VERSION="$MERVIN_VERSION" \
            -DMERVIN_PACKAGE_FORMAT=deb \
            -DMERVIN_BUILD_TESTS=OFF \
            -DMUPDF_DIR="$MUPDF_DIR"
          cmake --build build

      - name: Package .deb
        run: |
          cd build && cpack -G DEB
          REL="${{ matrix.release }}"
          mv "mervin-pdf_${MERVIN_VERSION}_amd64.deb" "mervin-pdf_${MERVIN_VERSION}_ubuntu${REL}_amd64.deb"
          dpkg-deb -I "mervin-pdf_${MERVIN_VERSION}_ubuntu${REL}_amd64.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-deb-ubuntu-${{ matrix.release }}
          path: build/mervin-pdf_*_amd64.deb
          if-no-files-found: error

  # ------------------------------------------------------------------- .rpm ---
  rpm:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      MERVIN_VERSION: ${{ needs.prepare.outputs.version }}
    container: fedora:44
    steps:
      - name: Install build deps
        # qt6-qttools-devel: Qt's LinguistTools CMake package; it requires
        # qt6-linguist (lupdate, lrelease). qt6-qttranslations: Qt's own catalogs,
        # listed so the build does not depend on dnf installing weak dependencies.
        run: |
          dnf install -y gcc-c++ make cmake ninja-build rpm-build \
            qt6-qtbase-devel qt6-qtsvg-devel qt6-qttools-devel qt6-qttranslations \
            qpdf-devel git tar curl findutils which python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build MuPDF
        run: echo "MUPDF_DIR=$(bash scripts/build-mupdf-linux.sh)" >> "$GITHUB_ENV"

      - name: Configure + build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMERVIN_VERSION="$MERVIN_VERSION" \
            -DMERVIN_PACKAGE_FORMAT=rpm \
            -DMERVIN_BUILD_TESTS=OFF \
            -DMUPDF_DIR="$MUPDF_DIR"
          cmake --build build

      - name: Package .rpm
        run: |
          cd build && cpack -G RPM
          rpm -qp --requires mervin-pdf-*.rpm

      - name: Upload .rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-rpm
          path: build/mervin-pdf-*.rpm
          if-no-files-found: error

  # -------------------------------------------------------- GitHub Release ---
  release:
    needs: [prepare, windows, appimage, deb, rpm]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          # The reusable workflow shares the CI run, including its separate
          # Windows verification upload. Publish only the release packages.
          pattern: '{windows-installers,linux-appimage,linux-deb-ubuntu-26.04,linux-rpm}'
      - name: Verify and checksum exact release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc[1-9][0-9]*)?",
              os.environ["RELEASE_TAG"],
          )
          if not match:
              raise SystemExit("Invalid release tag")
          version = os.environ["RELEASE_TAG"][1:]
          expected = {
              Path(f"dist/windows-installers/MervinPDF-Setup-{version}.exe"),
              Path(f"dist/windows-installers/MervinPDF-{version}.msi"),
              Path(f"dist/linux-appimage/MervinPDF-{version}-x86_64.AppImage"),
              Path(f"dist/linux-deb-ubuntu-26.04/mervin-pdf_{version}_ubuntu26.04_amd64.deb"),
              Path(f"dist/linux-rpm/mervin-pdf-{version}.x86_64.rpm"),
          }
          allowed_dirs = {Path("dist")}
          for path in expected:
              allowed_dirs.update(path.parents)

          actual = set()
          for path in Path("dist").rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"Unexpected symlink: {path}")
              if path.is_dir():
                  if path not in allowed_dirs:
                      raise SystemExit(f"Unexpected directory: {path}")
                  continue
              if not path.is_file():
                  raise SystemExit(f"Unexpected non-file artifact: {path}")
              actual.add(path)

          if actual != expected:
              raise SystemExit(
                  f"Artifact mismatch; missing={sorted(expected - actual)}, "
                  f"extra={sorted(actual - expected)}"
              )

          lines = []
          for path in sorted(expected):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              lines.append(f"{digest.hexdigest()}  {path.name}")
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n")
          if os.environ.get("RELEASE_VERSION") != version:
              raise SystemExit("Release version environment does not match tag")
          PY
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          files: |
            dist/windows-installers/MervinPDF-Setup-${{ env.RELEASE_VERSION }}.exe
            dist/windows-installers/MervinPDF-${{ env.RELEASE_VERSION }}.msi
            dist/linux-appimage/MervinPDF-${{ env.RELEASE_VERSION }}-x86_64.AppImage
            dist/linux-deb-ubuntu-26.04/mervin-pdf_${{ env.RELEASE_VERSION }}_ubuntu26.04_amd64.deb
            dist/linux-rpm/mervin-pdf-${{ env.RELEASE_VERSION }}.x86_64.rpm
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
