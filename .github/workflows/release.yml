name: release

# Stable tags publish regular releases. CI calls this workflow after a successful
# main push to allocate an RC tag and publish the same packages as a prerelease.
on:
  push:
    tags: ['v*']
  workflow_call:
  workflow_dispatch:
    inputs:
      store_version:
        description: 'Stable version for a Microsoft Store upload, for example 1.65.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  MUPDF_VERSION: "1.28.5"
  MUPDF_SHA256: "98a5c10cda20c3992cdf76ff6b2a1149c32bd79cc796d3f703230b1185b7e934"

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          [[ "$status" == identical || "$status" == ahead ]] || {
            echo "Release commit is not on main" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Prepare release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_VERSION: ${{ inputs.store_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            python3 scripts/prepare-prerelease.py
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(python3 scripts/version-from-tag.py "$GITHUB_REF_NAME")
            {
              echo "tag=$GITHUB_REF_NAME"
              echo "version=$version"
              if [[ "$version" == *-rc* ]]; then
                echo "prerelease=true"
              else
                echo "prerelease=false"
              fi
            } >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]; then
            version=$(python3 scripts/version-from-tag.py "v$STORE_VERSION")
            [[ "$version" != *-rc* ]] || { echo "Store submissions require a stable version" >&2; exit 1; }
            # Store uploads use a tested main commit without creating a GitHub release.
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&event=push" \
              --jq '[.workflow_runs[] | select(.head_branch == "main")] | length')
            [[ "$passed" -gt 0 ]] || { echo "This main commit needs a successful CI run first" >&2; exit 1; }
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releases require a version tag push or successful CI for a main push" >&2
            exit 1
          fi

      - name: Verify release tag
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          read -r type target < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv')
          if [[ "$type" == tag ]]; then
            read -r type target < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '[.object.type, .object.sha] | @tsv')
          fi
          [[ "$type" == commit && "$target" == "$GITHUB_SHA" ]] || {
            echo "Tag does not resolve to workflow commit $GITHUB_SHA" >&2
            exit 1
          }

  # ---------------------------------------------------------------- Windows ---
  windows:
    needs: prepare
    runs-on: windows-2022
    env:
      MERVIN_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned PowerShell and .NET SDK
        shell: pwsh
        run: scripts\install-windows-host-tools.ps1 -IncludeDotNet

      - name: Verify PowerShell selection
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.ToString() -ne '7.6.8') { throw 'Pinned PowerShell was not selected.' }

      - name: Set up MSVC (x64)
        # Maintained, Node-24 vcvars action (fork of the now-unmaintained
        # ilammy/msvc-dev-cmd). Exports the MSVC dev env to later steps via
        # $GITHUB_ENV/$GITHUB_PATH, so Configure/Build inherit cl/INCLUDE/LIB.
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Install pinned CMake and Ninja
        run: python scripts/install-build-tools.py

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          # aqtinstall 3.3.0 cannot read Qt 6.11+ Windows repository paths.
          # Pin the merged fix until it ships in a release: miurahr/aqtinstall#1000.
          setup-python: false
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          # Override the action's 1.1.0 default with the security release.
          py7zrversion: "==1.1.4"
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Hash MuPDF patches
        id: mupdf-patches
        shell: pwsh
        run: |
          $id = & scripts\build-mupdf-windows.ps1 -PrintPatchSet
          "id=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache MuPDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Must match build-mupdf-windows.ps1's default -Dest (invoked below with
          # no arguments): C:\dev is the project's tool root on Windows.
          path: C:\dev\src\mupdf-${{ env.MUPDF_VERSION }}-source
          # The patch set's identity, as the build script records it, gives each
          # MuPDF patch set its own cached build.
          key: mupdf-${{ env.MUPDF_VERSION }}-${{ env.MUPDF_SHA256 }}-windows-msvc2022-v143-jpeg-prefix-v1-${{ steps.mupdf-patches.outputs.id }}

      - name: Build MuPDF
        shell: pwsh
        run: |
          $dir = & scripts\build-mupdf-windows.ps1 | Select-Object -Last 1
          "MUPDF_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: vcpkg-x64-windows-static-md-

      - name: Configure
        shell: pwsh
        run: |
          # Read these in-shell ($env:) rather than via GitHub Actions expression
          # interpolation: QT_ROOT_DIR (exported by install-qt-action) and the
          # VCPKG_INSTALLATION_ROOT. The windows-base preset reads $env:QT6_DIR ->
          # CMAKE_PREFIX_PATH and $env:VCPKG_ROOT -> the vcpkg toolchainFile.
          $env:QT6_DIR = $env:QT_ROOT_DIR
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          $env:VCPKG_ROOT = $vcpkg
          # Version lookup uses the checked-out registry, so fetching the baseline
          # alone leaves the runner's older versions database active. Align the
          # registry, ports, toolchain and executable with our pinned revision.
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw "vcpkg.json must pin a builtin-baseline" }
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "Fetching vcpkg baseline failed" }
          git -C $env:VCPKG_ROOT checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { throw "Checking out vcpkg baseline failed" }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Bootstrapping vcpkg failed" }
          # MERVIN_BUILD_TESTS=OFF, same as every Linux job. The release pipeline
          # never runs ctest - the tests (and the tst_perf_* guardrails) are a local
          # check made BEFORE a change ships, not a release artifact. Building them
          # here cost 109 of the build step's 125 minutes: MervinPDF.exe links 15
          # minutes in, then 33 tst_/dump_ executables each statically re-link
          # MuPDF+Tesseract with PDBs, only to be thrown away unrun.
          cmake --preset x64-release "-DMERVIN_VERSION=$env:MERVIN_VERSION" -DMERVIN_WIN32_SUBSYSTEM=ON -DMERVIN_BUILD_TESTS=OFF "-DMUPDF_DIR=$env:MUPDF_DIR"

      - name: Build
        run: cmake --build --preset x64-release

      - name: Install WiX
        shell: pwsh
        env:
          # Select only our stable .NET installation for WiX's net8.0 apphost.
          DOTNET_ROOT: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROOT_X64: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROLL_FORWARD: Major
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: "0"
        run: |
          & "$env:DOTNET_ROOT_X64\dotnet.exe" tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw "Accepting the WiX EULA failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX UI extension failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Util.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX utility extension failed" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Stage app and build MSI
        shell: pwsh
        env:
          # Select only our stable .NET installation for WiX's net8.0 apphost.
          DOTNET_ROOT: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROOT_X64: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROLL_FORWARD: Major
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: "0"
        run: |
          $env:QT6_DIR = $env:QT_ROOT_DIR
          scripts\deploy.ps1 -Installer

      - name: Upload MSI
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi
          path: |
            build/x64-release/MervinPDF-*.msi
          if-no-files-found: error

      - name: Build unsigned Microsoft Store package
        shell: pwsh
        run: scripts\build-msix.ps1 -Version $env:MERVIN_VERSION

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msix-store-upload
          path: build/x64-release/MervinPDF-*-x64.msix
          if-no-files-found: error
          retention-days: 30

  # Official Qt and the pinned upstream libraries are bundled on every Linux
  # target. Build on Ubuntu 26.04 and Fedora 44 to retain their platform ABI.
  appimage:
    if: github.event_name != 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-26.04
    env:
      MERVIN_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates file git unzip zip tar pkg-config nasm patchelf \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libgtk-3-0t64 libcups2t64 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Install pinned CMake and Ninja
        run: python scripts/install-build-tools.py

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          setup-python: false
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          py7zrversion: "==1.1.4"
          version: "6.12.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Keep the complete base archive set, including Qt's translations.
          cache: true

      - name: Prepare pinned upstream dependencies
        run: |
          vcpkg_root=$(bash scripts/bootstrap-vcpkg-linux.sh dev-temp/vcpkg)
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
          echo "QT6_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Hash MuPDF patches
        id: mupdf-patches
        run: echo "id=$(bash scripts/build-mupdf-linux.sh --patch-set)" >> "$GITHUB_OUTPUT"

      - name: Cache MuPDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/src/mupdf-${{ env.MUPDF_VERSION }}-source
          # The patch set's identity, as the build script records it, gives each
          # MuPDF patch set its own cached build.
          key: mupdf-${{ env.MUPDF_VERSION }}-${{ env.MUPDF_SHA256 }}-ubuntu2604-${{ steps.mupdf-patches.outputs.id }}

      - name: Build MuPDF
        run: echo "MUPDF_DIR=$(bash scripts/build-mupdf-linux.sh)" >> "$GITHUB_ENV"

      - name: Configure + build
        run: |
          cmake --preset linux-bundled -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMERVIN_VERSION="$MERVIN_VERSION" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMERVIN_BUILD_TESTS=OFF \
            -DMUPDF_DIR="$MUPDF_DIR"
          cmake --build build

      - name: Check exported symbols
        # Exporting MuPDF's bundled libjpeg, FreeType, zlib or Brotli would make
        # Qt's JPEG plugin, libqpdf and Qt's fonts call MuPDF's copies.
        run: python3 scripts/check-linux-exports.py build/MervinPDF

      - name: Install into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Verify bundled install
        run: python3 scripts/check-linux-runtime.py AppDir/usr

      - name: Build AppImage
        run: bash scripts/make-appimage.sh "$MERVIN_VERSION" AppDir

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage
          path: MervinPDF-*-x86_64.AppImage
          if-no-files-found: error

  # Native packages use the same upstream dependency versions as the AppImage.
  deb:
    if: github.event_name != 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-26.04
    env:
      MERVIN_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates file git unzip zip tar pkg-config nasm patchelf \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libgtk-3-0t64 libcups2t64 libwayland-client0 libwayland-cursor0 libwayland-egl1 dpkg-dev

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Install pinned CMake and Ninja
        run: python scripts/install-build-tools.py

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          setup-python: false
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          py7zrversion: "==1.1.4"
          version: "6.12.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Keep the complete base archive set, including Qt's translations.
          cache: true

      - name: Prepare pinned upstream dependencies
        run: |
          vcpkg_root=$(bash scripts/bootstrap-vcpkg-linux.sh dev-temp/vcpkg)
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
          echo "QT6_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Build MuPDF
        run: echo "MUPDF_DIR=$(bash scripts/build-mupdf-linux.sh)" >> "$GITHUB_ENV"

      - name: Configure + build
        run: |
          cmake --preset linux-bundled -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMERVIN_VERSION="$MERVIN_VERSION" \
            -DMERVIN_PACKAGE_FORMAT=deb \
            -DMERVIN_BUILD_TESTS=OFF \
            -DMUPDF_DIR="$MUPDF_DIR"
          cmake --build build

      - name: Check exported symbols
        # Exporting MuPDF's bundled libjpeg, FreeType, zlib or Brotli would make
        # Qt's JPEG plugin, libqpdf and Qt's fonts call MuPDF's copies.
        run: python3 scripts/check-linux-exports.py build/MervinPDF

      - name: Package .deb
        run: |
          cd build && cpack -G DEB
          REL=26.04
          mv "mervin-pdf_${MERVIN_VERSION}_amd64.deb" "mervin-pdf_${MERVIN_VERSION}_ubuntu${REL}_amd64.deb"
          dpkg-deb -I "mervin-pdf_${MERVIN_VERSION}_ubuntu${REL}_amd64.deb"

      - name: Verify .deb payload
        run: |
          dpkg-deb -x build/mervin-pdf_*_amd64.deb dev-temp/deb-payload
          python3 scripts/check-linux-runtime.py dev-temp/deb-payload/usr

      - name: Upload .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb-ubuntu-26.04
          path: build/mervin-pdf_*_amd64.deb
          if-no-files-found: error

  # ------------------------------------------------------------------- .rpm ---
  rpm:
    if: github.event_name != 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    env:
      MERVIN_VERSION: ${{ needs.prepare.outputs.version }}
    container: fedora:44
    steps:
      - name: Install platform build dependencies
        run: |
          dnf install -y gcc-c++ make rpm-build git tar curl findutils which \
            unzip zip pkgconf nasm cpio patchelf \
            mesa-libGL-devel libxkbcommon-devel libxkbcommon-x11 xcb-util-cursor \
            xcb-util-wm xcb-util-keysyms xcb-util-image xcb-util-renderutil \
            fontconfig dbus-libs gtk3 cups-libs libwayland-client libwayland-cursor libwayland-egl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up portable Python 3.15.1
        run: |
          python_bin=$(bash scripts/bootstrap-python-linux.sh dev-temp/python)
          "$python_bin" -m venv dev-temp/build-tools
          echo "$PWD/dev-temp/build-tools/bin" >> "$GITHUB_PATH"

      - name: Install pinned CMake and Ninja
        run: python scripts/install-build-tools.py

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        env:
          # Portable Python records Clang, but this builder supplies GCC.
          CC: gcc
          CXX: g++
          LDSHARED: gcc -shared
        with:
          # Fedora dependencies are installed by DNF above. The action defaults to apt.
          install-deps: false
          setup-python: false
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          py7zrversion: "==1.1.4"
          version: "6.12.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Keep the complete base archive set, including Qt's translations.
          cache: true

      - name: Prepare pinned upstream dependencies
        run: |
          vcpkg_root=$(bash scripts/bootstrap-vcpkg-linux.sh dev-temp/vcpkg)
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
          echo "QT6_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Build MuPDF
        run: echo "MUPDF_DIR=$(bash scripts/build-mupdf-linux.sh)" >> "$GITHUB_ENV"

      - name: Configure + build
        run: |
          cmake --preset linux-bundled -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMERVIN_VERSION="$MERVIN_VERSION" \
            -DMERVIN_PACKAGE_FORMAT=rpm \
            -DMERVIN_BUILD_TESTS=OFF \
            -DMUPDF_DIR="$MUPDF_DIR"
          cmake --build build

      - name: Check exported symbols
        # Exporting MuPDF's bundled libjpeg, FreeType, zlib or Brotli would make
        # Qt's JPEG plugin, libqpdf and Qt's fonts call MuPDF's copies.
        run: python3 scripts/check-linux-exports.py build/MervinPDF

      - name: Package .rpm
        run: |
          cd build && cpack -G RPM
          rpm -qp --requires mervin-pdf-*.rpm

      - name: Verify .rpm payload
        run: |
          mkdir -p dev-temp/rpm-payload
          rpm2cpio build/mervin-pdf-*.rpm | (cd dev-temp/rpm-payload && cpio -idm --quiet)
          python3 scripts/check-linux-runtime.py dev-temp/rpm-payload/usr

      - name: Upload .rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-rpm
          path: build/mervin-pdf-*.rpm
          if-no-files-found: error

  # -------------------------------------------------------- GitHub Release ---
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [prepare, windows, appimage, deb, rpm]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # The reusable workflow shares the CI run, including its separate
          # Windows verification upload. Publish only the release packages.
          pattern: '{windows-msi,linux-appimage,linux-deb-ubuntu-26.04,linux-rpm}'
      - name: Verify and checksum exact release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc[1-9][0-9]*)?",
              os.environ["RELEASE_TAG"],
          )
          if not match:
              raise SystemExit("Invalid release tag")
          version = os.environ["RELEASE_TAG"][1:]
          expected = {
              Path(f"dist/windows-msi/MervinPDF-{version}.msi"),
              Path(f"dist/linux-appimage/MervinPDF-{version}-x86_64.AppImage"),
              Path(f"dist/linux-deb-ubuntu-26.04/mervin-pdf_{version}_ubuntu26.04_amd64.deb"),
              Path(f"dist/linux-rpm/mervin-pdf-{version}.x86_64.rpm"),
          }
          allowed_dirs = {Path("dist")}
          for path in expected:
              allowed_dirs.update(path.parents)

          actual = set()
          for path in Path("dist").rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"Unexpected symlink: {path}")
              if path.is_dir():
                  if path not in allowed_dirs:
                      raise SystemExit(f"Unexpected directory: {path}")
                  continue
              if not path.is_file():
                  raise SystemExit(f"Unexpected non-file artifact: {path}")
              actual.add(path)

          if actual != expected:
              raise SystemExit(
                  f"Artifact mismatch; missing={sorted(expected - actual)}, "
                  f"extra={sorted(actual - expected)}"
              )

          lines = []
          for path in sorted(expected):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              lines.append(f"{digest.hexdigest()}  {path.name}")
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n")
          if os.environ.get("RELEASE_VERSION") != version:
              raise SystemExit("Release version environment does not match tag")
          PY
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          files: |
            dist/windows-msi/MervinPDF-${{ env.RELEASE_VERSION }}.msi
            dist/linux-appimage/MervinPDF-${{ env.RELEASE_VERSION }}-x86_64.AppImage
            dist/linux-deb-ubuntu-26.04/mervin-pdf_${{ env.RELEASE_VERSION }}_ubuntu26.04_amd64.deb
            dist/linux-rpm/mervin-pdf-${{ env.RELEASE_VERSION }}.x86_64.rpm
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove superseded releases
        if: needs.prepare.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune-releases.py --released-tag "$RELEASE_TAG" --apply
