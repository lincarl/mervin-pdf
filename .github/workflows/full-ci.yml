name: Full CI

on:
  workflow_call:
    inputs:
      sha:
        description: Immutable commit to build and test
        required: true
        type: string
      msix_artifact_run:
        description: Reuse Windows binaries for an MSIX diagnostic run
        required: false
        default: ''
        type: string
      repository:
        description: Source repository for the immutable commit
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Check out workflow controls for their script tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: dev-temp/workflow-controls
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Validate metadata and scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          json.loads(Path("CMakePresets.json").read_text())
          json.loads(Path("vcpkg.json").read_text())

          metadata_text = Path("packaging/linux/mervin-pdf.metainfo.xml").read_text()
          root = ET.fromstring(metadata_text.replace("@MERVIN_VERSION@", "0.0.0"))
          if root.findtext("project_license") != "AGPL-3.0-only":
              raise SystemExit("AppStream project license must be AGPL-3.0-only")
          release = root.find("./releases/release")
          if release is None or "@MERVIN_VERSION@" not in metadata_text:
              raise SystemExit("AppStream release version must come from MERVIN_VERSION")

          expected = "https://github.com/lincarl/mervin-pdf"
          files = [
              Path("README.md"),
              Path("CMakeLists.txt"),
              Path("packaging/linux/mervin-pdf.metainfo.xml"),
          ]
          for path in files:
              text = path.read_text()
              if expected not in text:
                  raise SystemExit(f"{path} does not reference {expected}")
              if "luciro-pdf" in text or "github.com/OrlacLeic/" in text:
                  raise SystemExit(f"{path} contains a stale repository URL")

          tracked = [
              Path(raw.decode())
              for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              if raw
          ]
          pdfs = sorted(path for path in tracked if path.suffix.lower() == ".pdf")
          if pdfs:
              raise SystemExit(f"PDF fixtures must not be committed: {pdfs}")
          generated = sorted(
              path for path in tracked
              if path.suffix.lower() == ".pyc" or "__pycache__" in path.parts
          )
          if generated:
              raise SystemExit(f"Generated Python artifacts must not be committed: {generated}")
          # The maintainers' agent instructions are private. A Git hook copies
          # them into each maintainer checkout as an ignored AGENTS.md, which a
          # merge or `git add -f` could still commit.
          agent_files = sorted(
              path for path in tracked if path in (Path("AGENTS.md"), Path("CLAUDE.md"))
          )
          if agent_files:
              raise SystemExit(f"Agent instruction files must not be committed: {agent_files}")

          expected_release_api = '"https://api.github.com/repos/lincarl/mervin-pdf/releases/latest"'
          macros = subprocess.check_output(
              ["c++", "-dM", "-E", "-include", "src/update/ReleaseConfig.h", "-x", "c++", "/dev/null"],
              text=True,
          )
          release_api = re.search(r"^#define MERVIN_RELEASE_API_URL (.+)$", macros, re.MULTILINE)
          if release_api is None or release_api.group(1) != expected_release_api:
              raise SystemExit("ReleaseConfig does not define the public mervin-pdf release API")
          # tst_updater observes the actual metadata request made by Updater.

          required_licenses = (
              "MuPDF-AGPL-3.0.txt",
              "Qt-LGPL-3.0-only.txt",
              "qpdf-LICENSE.txt",
              "tesseract-LICENSE.txt",
              "leptonica-LICENSE.txt",
              "tomlplusplus-LICENSE.txt",
          )
          for name in required_licenses:
              path = Path("licenses") / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required license text is missing: {path}")

          blocked = (
              "OrlacLeic/" + "mervin-pdf",
              "lincarl/" + "luciro-pdf",
              "ref." + "elysics.se",
          )
          for path in tracked:
              if path == Path(".github/workflows/full-ci.yml"):
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              for value in blocked:
                  if value in text:
                      raise SystemExit(f"{path} contains blocked private/stale data: {value}")
          PY
          ruby <<'RUBY'
          require "yaml"

          walk = lambda do |node, path|
            case node
            when Hash
              node.each do |key, value|
                if key.to_s == "uses"
                  ref = value.to_s
                  local = ref.match?(/\A\.\/[^\0]+\z/)
                  pinned = ref.match?(/\A[^@\s]+@[0-9a-f]{40}\z/)
                  unless local || pinned
                    abort "#{path} uses a mutable or invalid action ref: #{ref}"
                  end
                end
                walk.call(value, path)
              end
            when Array
              node.each { |value| walk.call(value, path) }
            end
          end

          Dir.glob(".github/workflows/*.{yml,yaml}").sort.each do |path|
            walk.call(YAML.safe_load(File.read(path), aliases: false), path)
          end
          RUBY
          for script in scripts/*.sh \
            packaging/linux/postinst packaging/linux/postrm \
            packaging/linux/rpm-post.sh packaging/linux/rpm-postun.sh; do
            bash -n "$script"
          done
          python3 resources/icons/export_icon_frames.py --check

      - name: Test repository scripts
        run: |
          python3 -B dev-temp/workflow-controls/scripts/test_reviewed_ci.py
          python3 -B dev-temp/workflow-controls/scripts/test_cancel_pr_ci.py
          python3 -B scripts/test_linux_exports.py
          python3 -B scripts/test_linux_runtime.py
          python3 -B scripts/test_prepare_prerelease.py
          python3 -B scripts/test_release_versions.py
          python3 -B scripts/test_prune_releases.py
          python3 -B scripts/test_check_test_results.py
          python3 -B scripts/test_build_mupdf_linux.py
          python3 -B scripts/test_workflow_contracts.py
          python3 -B scripts/test_fetch_test_dependencies.py
          python3 -B scripts/test_windows_payload.py
          python3 -B scripts/test_msix_manifest.py

  linux-tests:
    if: inputs.msix_artifact_run == ''
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build: [release, sanitize]
    env:
      QT_QPA_PLATFORM: offscreen
      MERVIN_TEST_FONT: ${{ github.workspace }}/build/test-fonts/NotoSansCJKsc-Regular.otf
      MERVIN_TEST_TESSDATA_DIR: ${{ github.workspace }}/build/test-tessdata
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libtomlplusplus-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Install pinned CMake and Ninja
        run: python scripts/install-build-tools.py

      - name: Build minimum supported qpdf
        run: |
          mkdir -p dev-temp/qpdf-source
          curl --fail --location --retry 3 \
            https://github.com/qpdf/qpdf/releases/download/v11.10.0/qpdf-11.10.0.tar.gz \
            -o dev-temp/qpdf-source/qpdf.tar.gz
          echo '6295349aa18049f5f970bf0717aa76904ce326b6b14ce230cf96895f0c679fe3  dev-temp/qpdf-source/qpdf.tar.gz' | sha256sum --check
          tar -xzf dev-temp/qpdf-source/qpdf.tar.gz -C dev-temp/qpdf-source
          cmake -S dev-temp/qpdf-source/qpdf-11.10.0 -B dev-temp/qpdf-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_DOC=OFF -DBUILD_STATIC_LIBS=OFF \
            -DUSE_IMPLICIT_CRYPTO=OFF -DREQUIRE_CRYPTO_NATIVE=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/dev-temp/qpdf" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build dev-temp/qpdf-build --parallel 2
          cmake --install dev-temp/qpdf-build
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          setup-python: false
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          # Override the action's 1.1.0 default with the security release.
          py7zrversion: "==1.1.4"
          version: "6.12.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Hash MuPDF patches
        id: mupdf-patches
        run: echo "id=$(bash scripts/build-mupdf-linux.sh --patch-set)" >> "$GITHUB_OUTPUT"
      - name: Cache MuPDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/src/mupdf-1.28.6-source
          # The patch set's identity, as the build script records it, gives each
          # MuPDF patch set its own cached build.
          key: mupdf-1.28.6-ubuntu24-tests-v1-${{ steps.mupdf-patches.outputs.id }}
      - name: Build MuPDF
        run: echo "MUPDF_DIR=$(scripts/build-mupdf-linux.sh)" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: |
          python3 scripts/fetch-test-font.py build/test-fonts
          python3 scripts/fetch-test-tessdata.py build/test-tessdata
          flags=()
          if [ "${{ matrix.build }}" = sanitize ]; then
            flags+=("-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer")
            flags+=("-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined")
          fi
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMERVIN_BUILD_TESTS=ON \
            -Dqpdf_DIR="$PWD/dev-temp/qpdf/lib/cmake/qpdf" "${flags[@]}"
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: |
          ctest --test-dir build/ci --show-only=json-v1 -LE optional-corpus > build/ci/expected-tests.json
          ctest --test-dir build/ci --output-on-failure --output-junit results.xml -LE optional-corpus --parallel 2 --timeout 180
          python3 scripts/check-test-results.py build/ci/results.xml --expected build/ci/expected-tests.json

  # Preserve the job ID used by reviewed-ci while testing the bundled release
  # dependencies. linux-tests remains the intentional qpdf 11.10 support lane.
  linux-system-qt-tests:
    if: inputs.msix_artifact_run == ''
    runs-on: ubuntu-26.04
    env:
      QT_QPA_PLATFORM: offscreen
      MERVIN_TEST_FONT: ${{ github.workspace }}/build/test-fonts/NotoSansCJKsc-Regular.otf
      MERVIN_TEST_TESSDATA_DIR: ${{ github.workspace }}/build/test-tessdata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates file git unzip zip tar pkg-config nasm patchelf \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libgtk-3-0t64 libcups2t64 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Install pinned CMake and Ninja
        run: python scripts/install-build-tools.py

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          setup-python: false
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          py7zrversion: "==1.1.4"
          version: "6.12.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Keep the complete base archive set, including Qt's translations.
          cache: true

      - name: Prepare pinned upstream dependencies
        run: |
          vcpkg_root=$(bash scripts/bootstrap-vcpkg-linux.sh dev-temp/vcpkg)
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
          echo "QT6_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Hash MuPDF patches
        id: mupdf-patches
        run: echo "id=$(bash scripts/build-mupdf-linux.sh --patch-set)" >> "$GITHUB_OUTPUT"
      - name: Cache MuPDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/src/mupdf-1.28.6-source
          # The patch set's identity, as the build script records it, gives each
          # MuPDF patch set its own cached build.
          key: mupdf-1.28.6-ubuntu2604-tests-v1-${{ steps.mupdf-patches.outputs.id }}
      - name: Build MuPDF
        run: echo "MUPDF_DIR=$(scripts/build-mupdf-linux.sh)" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          python3 scripts/fetch-test-font.py build/test-fonts
          python3 scripts/fetch-test-tessdata.py build/test-tessdata
          cmake --preset linux-bundled -B build/ci -DMERVIN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: |
          # Qt has its own RUNPATH, so build-tree tests need the selected zlib path.
          export LD_LIBRARY_PATH="$PWD/build/ci/vcpkg_installed/x64-linux-dynamic/lib"
          ctest --test-dir build/ci --show-only=json-v1 -LE optional-corpus > build/ci/expected-tests.json
          ctest --test-dir build/ci --output-on-failure --output-junit results.xml -LE optional-corpus --parallel 2 --timeout 180
          python3 scripts/check-test-results.py build/ci/results.xml --expected build/ci/expected-tests.json

      - name: Verify bundled install
        run: |
          DESTDIR="$PWD/dev-temp/bundled-install" cmake --install build/ci
          python3 scripts/check-linux-runtime.py dev-temp/bundled-install/usr

  windows-tests:
    if: inputs.msix_artifact_run == ''
    runs-on: windows-2022
    env:
      # Store manifests require a nonzero major version. Verification packages
      # use this fixed test version and are never submitted to Microsoft Store.
      MERVIN_VERSION: "1.0.0"
      MUPDF_VERSION: "1.28.6"
      MUPDF_SHA256: "dc85000640a45d90ca9b77b061f6ca67cce0c4d4fbecf8819647baf573eef101"
      QT_QPA_PLATFORM: offscreen
      MERVIN_TEST_FONT: ${{ github.workspace }}/build/test-fonts/NotoSansCJKsc-Regular.otf
      MERVIN_TEST_TESSDATA_DIR: ${{ github.workspace }}/build/test-tessdata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Install pinned PowerShell and .NET SDK
        shell: pwsh
        run: scripts\install-windows-host-tools.ps1 -IncludeDotNet

      - name: Verify PowerShell selection
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.ToString() -ne '7.6.8') { throw 'Pinned PowerShell was not selected.' }

      - name: Set up MSVC (x64)
        # Maintained, Node-24 vcvars action (fork of the now-unmaintained
        # ilammy/msvc-dev-cmd). Exports the MSVC dev env to later steps via
        # $GITHUB_ENV/$GITHUB_PATH, so Configure/Build inherit cl/INCLUDE/LIB.
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Install pinned CMake and Ninja
        run: python scripts/install-build-tools.py

      - name: Fetch test data
        run: |
          python scripts/fetch-test-font.py build/test-fonts
          python scripts/fetch-test-tessdata.py build/test-tessdata

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          # aqtinstall 3.3.0 cannot read Qt 6.11+ Windows repository paths.
          # Pin the merged fix until it ships in a release: miurahr/aqtinstall#1000.
          setup-python: false
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          # Override the action's 1.1.0 default with the security release.
          py7zrversion: "==1.1.4"
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Hash MuPDF patches
        id: mupdf-patches
        shell: pwsh
        run: |
          $id = & scripts\build-mupdf-windows.ps1 -PrintPatchSet
          "id=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache MuPDF
        id: mupdf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: C:\dev\src\mupdf-${{ env.MUPDF_VERSION }}-tests-source
          # The patch set's identity, as the build script records it, gives each
          # MuPDF patch set its own cached build.
          key: mupdf-${{ env.MUPDF_VERSION }}-${{ env.MUPDF_SHA256 }}-windows-msvc2022-v143-tests-native-jpeg-prefix-v1-${{ steps.mupdf-patches.outputs.id }}

      - name: Build MuPDF
        shell: pwsh
        run: |
          $dir = & scripts\build-mupdf-windows.ps1 -NoLtcg -Dest "C:\dev\src\mupdf-${env:MUPDF_VERSION}-tests-source" | Select-Object -Last 1
          "MUPDF_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Save MuPDF cache
        if: github.event_name != 'pull_request' && steps.mupdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: C:\dev\src\mupdf-${{ env.MUPDF_VERSION }}-tests-source
          key: ${{ steps.mupdf-cache.outputs.cache-primary-key }}

      - name: Cache vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: vcpkg-x64-windows-static-md-

      - name: Configure
        shell: pwsh
        run: |
          # Read these in-shell ($env:) rather than via GitHub Actions expression
          # interpolation: QT_ROOT_DIR (exported by install-qt-action) and the
          # VCPKG_INSTALLATION_ROOT. The windows-base preset reads $env:QT6_DIR ->
          # CMAKE_PREFIX_PATH and $env:VCPKG_ROOT -> the vcpkg toolchainFile.
          $env:QT6_DIR = $env:QT_ROOT_DIR
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          $env:VCPKG_ROOT = $vcpkg
          # Version lookup uses the checked-out registry, so fetching the baseline
          # alone leaves the runner's older versions database active. Align the
          # registry, ports, toolchain and executable with our pinned revision.
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw "vcpkg.json must pin a builtin-baseline" }
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "Fetching vcpkg baseline failed" }
          git -C $env:VCPKG_ROOT checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { throw "Checking out vcpkg baseline failed" }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Bootstrapping vcpkg failed" }
          cmake --preset x64-release -DCMAKE_BUILD_TYPE=Release "-DMERVIN_VERSION=$env:MERVIN_VERSION" -DMERVIN_BUILD_TESTS=ON "-DMUPDF_DIR=$env:MUPDF_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Configuring failed" }

      - name: Save vcpkg cache
        if: github.event_name != 'pull_request' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset x64-release --parallel 2
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build/x64-release --show-only=json-v1 -LE optional-corpus > build/x64-release/expected-tests.json
          if ($LASTEXITCODE -ne 0) { throw "Test inventory failed" }
          ctest --test-dir build/x64-release --output-on-failure --output-junit results.xml -LE optional-corpus --parallel 1 --timeout 180
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
          python scripts/check-test-results.py build/x64-release/results.xml --expected build/x64-release/expected-tests.json
          if ($LASTEXITCODE -ne 0) { throw "Required tests were skipped" }

      - name: Install WiX
        shell: pwsh
        env:
          # Select only our stable .NET installation for WiX's net8.0 apphost.
          DOTNET_ROOT: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROOT_X64: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROLL_FORWARD: Major
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: "0"
        run: |
          & "$env:DOTNET_ROOT_X64\dotnet.exe" tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw "Accepting the WiX EULA failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX UI extension failed" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Util.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX utility extension failed" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Stage app and build MSI
        shell: pwsh
        env:
          # Select only our stable .NET installation for WiX's net8.0 apphost.
          DOTNET_ROOT: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROOT_X64: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROLL_FORWARD: Major
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: "0"
        run: |
          $env:QT6_DIR = $env:QT_ROOT_DIR
          scripts\deploy.ps1 -Installer

      - name: Verify MSI install, upgrade, repair, and uninstall
        shell: pwsh
        env:
          # Select only our stable .NET installation for WiX's net8.0 apphost.
          DOTNET_ROOT: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROOT_X64: ${{ env.MERVIN_DOTNET_ROOT }}
          DOTNET_ROLL_FORWARD: Major
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: "0"
        run: scripts\test-windows-installer.ps1 -Msi (Get-Item build\x64-release\MervinPDF-*.msi).FullName

      - name: Verify MSI wizard and launch after Finish
        shell: pwsh
        run: |
          scripts\test-windows-installer-ui.ps1 -Msi (Get-Item build\x64-release\MervinPDF-*.msi).FullName `
            -OutputDir "$env:MERVIN_INSTALLER_TEST_DIR\ui"

      - name: Upload Windows installer diagnostics
        if: always() && env.MERVIN_INSTALLER_TEST_DIR != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-diagnostics
          overwrite: true
          path: ${{ env.MERVIN_INSTALLER_TEST_DIR }}/
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned MSIX
        shell: pwsh
        run: scripts\build-msix.ps1 -Version $env:MERVIN_VERSION

      - name: Upload Windows verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-verification
          overwrite: true
          path: |
            build/x64-release/deploy/
            build/x64-release/MervinPDF-*.msi
            build/x64-release/MervinPDF-*-x64.msix
            build/x64-release/MervinPDF-*-x64-msix-pri/
            build/x64-release/windows-payload.json
            build/x64-release/tests/fixtures/properties.pdf
            build/x64-release/results.xml
            build/x64-release/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7

  windows-msix-tests:
    needs: windows-tests
    if: always() && !cancelled() && (needs.windows-tests.result == 'success' || inputs.msix_artifact_run != '')
    # Server 2025 can install the package's Windows 11 minimum build. The
    # compiler job retains its existing Server 2022 toolchain and MSI tests.
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Install pinned PowerShell
        shell: pwsh
        run: scripts\install-windows-host-tools.ps1
      - name: Verify PowerShell selection
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.ToString() -ne '7.6.8') { throw 'Pinned PowerShell was not selected.' }
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Validate diagnostic artifact provenance
        if: inputs.msix_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.msix_artifact_run }}
        run: python -B scripts/reviewed_ci.py diagnostic
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-verification
          path: build/x64-release
          run-id: ${{ inputs.msix_artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild diagnostic MSIX from the selected payload
        if: inputs.msix_artifact_run != ''
        shell: pwsh
        run: |
          $version = (Get-Item build\x64-release\deploy\MervinPDF.exe).VersionInfo.FileVersion
          scripts\build-msix.ps1 -Version $version
      - name: Verify MSIX installation, activation, upgrade, and uninstall
        shell: powershell
        run: |
          python scripts\generate-store-sample.py build\x64-release\tests\fixtures\Birch-courtyard-studio.pdf
          if ($LASTEXITCODE -ne 0) { throw 'Generating the Store screenshot document failed.' }
          scripts\test-windows-msix.ps1 -Msix (Get-Item build\x64-release\MervinPDF-*-x64.msix).FullName `
            -Fixture build\x64-release\tests\fixtures\Birch-courtyard-studio.pdf
      - name: Upload MSIX diagnostics
        if: always() && env.MERVIN_MSIX_TEST_DIR != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msix-diagnostics
          overwrite: true
          path: ${{ env.MERVIN_MSIX_TEST_DIR }}/
          if-no-files-found: error
          retention-days: 7

  required-jobs:
    needs: [repository-checks, linux-tests, linux-system-qt-tests, windows-tests, windows-msix-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Older PR heads may contain the old helper. Use the workflow's controls
      # when checking job results, independently of the application revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Require every expected test job to succeed
        env:
          CI_REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          CI_LINUX_RESULT: ${{ needs.linux-tests.result }}
          CI_LINUX_SYSTEM_RESULT: ${{ needs.linux-system-qt-tests.result }}
          CI_WINDOWS_RESULT: ${{ needs.windows-tests.result }}
          CI_MSIX_RESULT: ${{ needs.windows-msix-tests.result }}
          CI_DIAGNOSTIC: ${{ inputs.msix_artifact_run != '' }}
        run: python3 -B scripts/reviewed_ci.py check-results
