name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      msix_artifact_run:
        description: 'Diagnostic MSIX-only run. Reuse Windows binaries from this CI run ID.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Each main push keeps its own tests and prerelease, including repeated commits.
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != refs/heads/main ]; then
            echo 'This workflow accepts only main. Pull requests run PR CI automatically.' >&2
            exit 1
          fi

  full-ci:
    needs: validate-trigger
    if: inputs.msix_artifact_run == ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/full-ci.yml
    with:
      sha: ${{ github.sha }}

  msix-diagnostic:
    needs: validate-trigger
    if: github.event_name == 'workflow_dispatch' && inputs.msix_artifact_run != ''
    permissions:
      actions: read
      contents: read
    cache-mode: read
    uses: ./.github/workflows/full-ci.yml
    with:
      sha: ${{ github.sha }}
      msix_artifact_run: ${{ inputs.msix_artifact_run }}

  prerelease:
    needs: full-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    # GITHUB_TOKEN-created tags do not trigger workflows. Call the shared
    # packaging workflow directly after the checks pass.
    uses: ./.github/workflows/release.yml
